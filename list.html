<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafes — BrewFinder</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" type="button">🌙 다크</button>

    <nav class="tabbar">
      <a href="index.html"><span class="icon">🏠</span>Home</a>
      <a href="list.html" aria-current="page"><span class="icon">🔍</span>Search</a>
      <a href="list.html?filter=rating"><span class="icon">⭐</span>Favorites</a>
      <a href="detail.html?id=brew-haven"><span class="icon">👤</span>Profile</a>
    </nav>

    <main class="wrap">
      <h1 class="page-title">Cafes</h1>
      <p class="page-sub">후보를 같은 축으로 비교합니다 — 거리 · 평점 · 분위기.</p>

      <!-- 비교 단계: 조건으로 후보를 압축하는 필터를 최상단에 둔다 -->
      <div class="chips" id="filterChips">
        <button class="chip" type="button" data-filter="nearby" aria-pressed="false">Nearby</button>
        <button class="chip" type="button" data-filter="rating" aria-pressed="false">Rating</button>
        <button class="chip" type="button" data-filter="quiet" aria-pressed="false">조용함</button>
        <button class="chip" type="button" data-filter="all" aria-pressed="true">전체</button>
      </div>

      <p class="muted" id="listCount"></p>
      <ul class="card-list" id="cafeList"></ul>
    </main>


    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      // URL 쿼리(?filter=rating)로 들어와도 같은 화면을 재현할 수 있게 한다.
      // 링크로 상태를 공유할 수 있고, 새로고침해도 필터가 유지됩니다.
      initFilterChips(new URLSearchParams(location.search).get('filter') || 'all');
      initTheme();
      initTracking();
    </script>
  </body>
</html>
